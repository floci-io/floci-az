quarkus:
  log:
    console:
      format: "%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p [%c{3.}] %s%e%n"
  http:
    port: ${floci-az.port}
    host: 0.0.0.0
    limits:
      max-body-size: 2G
    cors:
      # Permissive by default, matching the emulator's dev-only stance: a browser SPA (msal-react)
      # calling the Entra authorize/token endpoints from its own origin needs CORS + a handled
      # OPTIONS preflight, which the Vert.x-level CORS filter answers before any request reaches
      # AzureRoutingFilter or a JAX-RS resource.
      enabled: true
      origins: /.*/
  native:
    resources:
      includes: artemis/**,azure/**
    additional-build-args: >-
      --initialize-at-run-time=org.apache.hc.client5.http.impl.auth.NTLMEngineImpl,
      --initialize-at-run-time=com.github.dockerjava.transport.NamedPipeSocket$Kernel32,
      --initialize-at-run-time=com.github.dockerjava.core.util.CertificateUtils,
      --initialize-at-run-time=org.bouncycastle.jcajce.provider.drbg.DRBG$Default,
      --initialize-at-run-time=org.bouncycastle.jcajce.provider.drbg.DRBG$NonceAndIV,
      --initialize-at-run-time=org.bouncycastle.crypto.prng.SP800SecureRandom,
      --initialize-at-run-time=org.bouncycastle.jcajce.provider.asymmetric.rsa.KeyPairGeneratorSpi,
      --initialize-at-run-time=org.bouncycastle.jcajce.provider.asymmetric.x509.CertificateFactory,
      --initialize-at-run-time=io.floci.az.core.tls.TlsConfigSource,
      --initialize-at-run-time=io.floci.az.core.tls.CertificateGenerator,
      --initialize-at-run-time=io.floci.az.services.eventhub.ArtemisTlsGenerator,
      --initialize-at-run-time=io.floci.az.services.acr.AcrHandler,
      --initialize-at-run-time=io.floci.az.services.redis.RedisHandler,
      --initialize-at-run-time=io.floci.az.services.entra.TokenIssuer,
      --initialize-at-run-time=io.floci.az.services.entra.SigningKeyProvider,
      --initialize-at-run-time=io.floci.az.services.entra.SecretHasher,
      --initialize-at-run-time=io.floci.az.services.keyvault.KeyVaultCrypto,
      --initialize-at-run-time=io.floci.az.services.eventgrid.EventGridService

floci-az:
  port: 4577
  tls:
    enabled: false    # set to true to enable HTTP+HTTPS on the same port via protocol-sniffing proxy
    self-signed: true  # auto-generate self-signed cert when no cert-path/key-path provided
    https-port: 443    # FLOCI_AZ_TLS_HTTPS_PORT — also bind 443 so Azure SDK default-HTTPS clients reach floci-az (0 disables)
  base-url: http://localhost:4577
  storage:
    # Global default — applies to every service unless overridden below.
    # Supported modes: memory, persistent, hybrid, wal
    mode: memory
    persistent-path: ./data
    host-persistent-path: ./data
    wal:
      compaction-interval-ms: 30000
    hybrid:
      flush-interval-ms: 5000
    services:
      blob:
        # mode: wal          # uncomment to override for blob only
        flush-interval-ms: 5000
      queue:
        # mode: memory
        flush-interval-ms: 5000
      table:
        # mode: persistent
        flush-interval-ms: 5000
      app-config:
        flush-interval-ms: 5000
      cosmos:
        flush-interval-ms: 5000
      key-vault:
        flush-interval-ms: 5000
      service-bus:
        flush-interval-ms: 5000
      sql:
        flush-interval-ms: 5000
      monitor:
        flush-interval-ms: 5000
      container-apps:
        flush-interval-ms: 5000
      email:
        flush-interval-ms: 5000
      directory:                    # tenants, subscriptions (seeded, configured, first use) and, under the resource-group overrides, groups
        flush-interval-ms: 5000

  # How closely floci-az follows Azure where Azure differs from what floci-az has always answered.
  # compat (default): nothing a client could rely on changes. azure: every parity override on.
  # strict: azure plus every strict-* override (Azure's refusals). Each override defaults from the level
  # and can be set on its own to opt in piecemeal.
  parity: compat                    # FLOCI_AZ_PARITY
  # parity-overrides:
    # subscription-listing: true    # FLOCI_AZ_PARITY_OVERRIDES_SUBSCRIPTION_LISTING; default on from azure.
    #                               # GET /subscriptions also lists first-use subscriptions, and
    #                               # GET /subscriptions/{sub} echoes the directory's id, not the path's spelling
    # strict-subscriptions: true    # FLOCI_AZ_PARITY_OVERRIDES_STRICT_SUBSCRIPTIONS; default on from strict.
    #                               # An unknown subscription is 404 SubscriptionNotFound instead of being
    #                               # registered on first use
    # resource-group-semantics: true  # FLOCI_AZ_PARITY_OVERRIDES_RESOURCE_GROUP_SEMANTICS; default on from azure.
    #                               # Resource-group re-PUT answers 200, a child PUT under a missing group creates it,
    #                               # and groups persist in the directory store
    # resource-group-delete: true   # FLOCI_AZ_PARITY_OVERRIDES_RESOURCE_GROUP_DELETE; default on from azure.
    #                               # Resource-group DELETE is a 202 long-running operation that deletes every
    #                               # resource in the group first; a write into a group being deleted is 409, and
    #                               # /resources also lists Monitor, Event Grid and Email resources
    # strict-resource-groups: true  # FLOCI_AZ_PARITY_OVERRIDES_STRICT_RESOURCE_GROUPS; default on from strict.
    #                               # A request for a resource under a missing group is 404 ResourceGroupNotFound,
    #                               # and groups persist in the directory store

  # The cloud a tenant lives in when nothing names one: AzureCloud, AzureUSGovernment or AzureChinaCloud.
  cloud:
    default: AzureCloud             # FLOCI_AZ_CLOUD_DEFAULT

  # Tenants and subscriptions besides the defaults (services.entra.default-tenant-id and
  # services.arm.default-subscription-id, which always exist). Only id is required. An entry with a
  # default's id overrides it. Env vars index the list: FLOCI_AZ_TENANTS_0__ID, FLOCI_AZ_SUBSCRIPTIONS_0__STATE.
  # tenants:
  #   - id: 11111111-0000-0000-0000-000000000000
  #     display-name: Contoso
  #     default-domain: contoso.onmicrosoft.com
  #     cloud: AzureUSGovernment    # default: cloud.default
  # subscriptions:
  #   - id: 22222222-0000-0000-0000-000000000000
  #     tenant-id: 11111111-0000-0000-0000-000000000000   # default: the default tenant
  #     display-name: contoso-dev
  #     state: Enabled              # Enabled, Warned, PastDue, Disabled or Deleted

  dns:
    # When floci-az runs inside Docker, an embedded DNS server is started on port 53
    # and injected into every Azure Functions container as their resolver. It resolves
    # *.hostname (above) and any extra suffixes to floci-az's Docker network IP.
    # extra-suffixes:
    #   - myapp.internal

    # Public resolvers used as the fallback upstream for floci-az's own DNS forwarder,
    # so function containers can resolve public hostnames even if the resolv.conf
    # resolver cannot answer. Disable in offline/locked-down networks where these
    # resolvers are blocked.
    container-fallback-enabled: true              # FLOCI_AZ_DNS_CONTAINER_FALLBACK_ENABLED
    container-fallback-servers:                   # FLOCI_AZ_DNS_CONTAINER_FALLBACK_SERVERS=1.1.1.1,1.0.0.1
      - 8.8.8.8
      - 8.8.4.4

  docker:
    docker-host: unix:///var/run/docker.sock
    # How sidecars are addressed: auto (container name/IP when floci-az runs in a
    # container, localhost otherwise) or published (the Docker daemon's host and the
    # published port; for remote daemons such as docker-in-docker or kubedock).
    endpoint-mode: auto
    log-max-size: "10m"
    log-max-file: "3"
    resource-namespace: ""

  services:
    signalr:
      enabled: true
      access-key: bG9jYWwtc2lnbmFsci1kZXZlbG9wbWVudC1rZXk=
    blob:
      enabled: true
      hierarchical-namespace-accounts: devstoreaccount1
    queue:
      enabled: true
    table:
      enabled: true
    functions:
      enabled: true
      mocked: false         # false = run functions in real runtime containers (default). true = no Docker; invocations return a synthetic 200 stub
      code-path: ${user.home}/.floci-az/functions
      ephemeral: false
      container-idle-timeout-seconds: 300
    app-config:
      enabled: true
    cosmos:
      enabled: true
      mocked: false         # false = allow real engine containers per enabled API (default). true = no Docker; all engine containers forced off
      engines:
        startup: on-demand
        default-api: nosql
        nosql:
          enabled: false
          # Embedded
        mongodb:
          enabled: false
          # image: mongo:7
        postgresql:
          enabled: false
          # image: citusdata/citus:12
        cassandra:
          enabled: false
          # image: scylladb/scylla:6.2
        gremlin:
          enabled: false
          # image: tinkerpop/gremlin-server
        table:
          enabled: false
          # Embedded
    key-vault:
      enabled: true
    event-hub:
      enabled: true
      # Real Artemis, not a mock: the AMQP data plane now works with the Azure SDKs, so both compat
      # suites run for real against it rather than self-skipping on this flag.
      mocked: false
      default-namespace: emulatorNs1
      entities: "eh1:4"
      amqp-port: 5672
      amqp-tls-port: 5671
      kafka-enabled: false
      kafka-port: 9093
      artemis-image: "apache/activemq-artemis:2.44.0"   # must match artemis.version in pom.xml (patched jars are version-specific)
      redpanda-image: "redpandadata/redpanda:latest"
      consumer-groups: "$Default,my-consumer-group"
    sql:
      enabled: true
      # data-plane.provider defaults to none, unless accept-eula=Y preserves legacy managed mode.
      # data-plane:
      #   provider: managed
      # mocked: false       # Deprecated alias: true = none, false = managed
      # accept-eula: "Y"     # Must be set to "Y" to accept the Microsoft SQL Server EULA
      image: "mcr.microsoft.com/mssql/server:2025-latest"
      sa-password: "FlociAz_Strong123!"
      startup-timeout-seconds: 60
      default-port: 0        # 0 = OS picks a free port per server (recommended)
    postgres:               # Azure Database for PostgreSQL (Flexible Server). No EULA (postgres image is PostgreSQL-licensed).
      enabled: true
      mocked: false         # false = back servers with a real postgres container. true = no Docker; servers are pure ARM state (no live endpoint)
      image: "postgres:17-alpine"
      startup-timeout-seconds: 60
      default-port: 0        # 0 = OS picks a free port per server (recommended)
    mysql:                  # Azure Database for MySQL (Flexible Server). No EULA (mysql image is GPL-licensed).
      enabled: true
      mocked: false         # false = back servers with a real mysql container. true = no Docker; servers are pure ARM state (no live endpoint)
      image: "mysql:8.0"
      startup-timeout-seconds: 60
      default-port: 0        # 0 = OS picks a free port per server (recommended)
    maria-db:               # Azure Database for MariaDB (single server). No EULA (mariadb image is GPL-licensed).
      enabled: true
      mocked: false         # false = back servers with a real mariadb container. true = no Docker; servers are pure ARM state (no live endpoint)
      image: "mariadb:10.11"
      startup-timeout-seconds: 60
      default-port: 0        # 0 = OS picks a free port per server (recommended)
    service-bus:
      enabled: true
      # Keep the broker opt-in because each namespace owns an Artemis sidecar.
      mocked: true
      # true = the default namespace starts with the emulator (deterministic AMQP endpoint at boot).
      start-on-boot: false
      # Optional path to a declarative topology file (official emulator Config.json format);
      # when unset, /ServiceBus_Emulator/ConfigFiles/Config.json is probed.
      # topology-file: /path/to/Config.json
      amqp-port: 5673
      amqp-tls-port: 5674
      artemis-image: "apache/activemq-artemis:2.44.0"
      max-delivery-count: 10
      lock-duration-seconds: 60
    monitor:
      enabled: true
    aks:
      enabled: true
      mocked: false
      default-image: "rancher/k3s:latest"
      api-server-base-port: 6443
      api-server-max-port: 7443
      keep-running-on-shutdown: false
    aci:
      enabled: true
      mocked: true          # true = no Docker; container groups are pure ARM state (Succeeded/Running). false = back groups with real containers (shared-netns pods)
      base-port: 7500       # host-port range for published group ports (clear of acr 5000-5099, redis 6379-6399, aks 6443-7443)
      max-port: 7599
    container-apps:
      enabled: true
      mocked: true          # true = ARM state only. false = run revision replicas in Docker
      dns-suffix: azurecontainerapps.io
      ingress-timeout-seconds: 60
    vm:
      enabled: true
      mocked: true          # true = no Docker; VMs are pure ARM state. false = back VMs with containers (phase 2)
      default-image: "ubuntu:22.04"
    apim:
      enabled: true
    redis:
      enabled: true
      mocked: false         # false = back caches with real Valkey containers (default). true = no Docker; pure ARM state
      default-image: "valkey/valkey:8-alpine"   # RESP-compatible Redis fork (BSD-licensed)
      base-port: 6379
      max-port: 6399
      max-memory: "256mb"
      tls-enabled: false    # FLOCI_AZ_SERVICES_REDIS_TLS_ENABLED. true = also serve TLS on sslPort (takes a second host port per cache)
    acr:
      enabled: true
      mocked: false         # false = back registries with a shared registry:2 container (default). true = no Docker; pure ARM state
      default-image: "registry:2"
      base-port: 5000
      max-port: 5099
    entra:
      enabled: true                 # local OpenID Connect provider (signed RS256 tokens, JWKS, discovery)
      default-tenant-id: "00000000-0000-0000-0000-000000000002"
      # issuer:                     # optional override; default derived from request base URL as {baseUrl}/{tenant}/v2.0
      token-lifetime-seconds: 3599
      validate-tokens: false        # true = BearerTokenVerifier validates signature/claims (default off: permissive dev auth)
      validate-client-credentials: false   # FLOCI_AZ_SERVICES_ENTRA_VALIDATE_CLIENT_CREDENTIALS: true = unknown client_id and wrong secrets are rejected (AADSTS700016, AADSTS7000215)
      # signing-key-path:           # optional; default {storage.persistent-path}/entra
    graph:
      enabled: true                 # Microsoft Graph slice at /v1.0/...: servicePrincipals discovery + group membership
    # docker-network:  # optional: shared Docker network for sidecar containers
    email:
      enabled: true
    arm:
      enabled: true       # central management plane (/providers, /subscriptions, resource groups). Disabling turns OFF all ARM-based services.
      default-subscription-id: "00000000-0000-0000-0000-000000000001"   # always exists; listed first by GET /subscriptions (what az login selects)
    network:
      enabled: true       # Microsoft.Network — VNet, subnets, NIC, public IP, NSG, and DNS zones
    event-grid:
      enabled: true       # Microsoft.EventGrid — Custom Topics + webhook event subscriptions (HTTP pub/push)
      default-region: eastus
      max-delivery-attempts: 30
    managed-identity:
      enabled: true       # Microsoft.ManagedIdentity — user-assigned identities + IMDS/App Service token endpoints (tokens signed with the entra key)
      # ARM scope that seeds the system-assigned IMDS identity; set it to your resource's
      # scope so IMDS tokens match GET {scope}/.../identities/default reads.
      system-assigned-scope: subscriptions/${floci-az.services.arm.default-subscription-id}
      # App Service Managed Identity token endpoint (IDENTITY_ENDPOINT/IDENTITY_HEADER protocol).
      app-service-enabled: true              # FLOCI_AZ_SERVICES_MANAGED_IDENTITY_APP_SERVICE_ENABLED
      app-service-path: msi/token            # FLOCI_AZ_SERVICES_MANAGED_IDENTITY_APP_SERVICE_PATH
      app-service-header-secret: floci-az-msi-secret   # FLOCI_AZ_SERVICES_MANAGED_IDENTITY_APP_SERVICE_HEADER_SECRET
    policy:
      enabled: true       # Microsoft.Authorization policy definitions, set definitions, assignments and exemptions (control plane only, no rule evaluation)
    resource-graph:
      enabled: true       # FLOCI_AZ_SERVICES_RESOURCE_GRAPH_ENABLED: Microsoft.ResourceGraph queries (KQL subset) over the emulator's resources

  auth:
    # Not enforced yet: every value behaves like dev, accepting any credentials without
    # SharedKey signature validation. Blob service SAS signatures are checked against
    # storage-account-keys below regardless of this setting.
    mode: dev
    storage-account-keys:
      devstoreaccount1: "Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw=="
