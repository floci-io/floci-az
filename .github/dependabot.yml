version: 2
updates:
  # Every entry sets its commit message explicitly. Left to itself, Dependabot infers the prefix
  # from repo history per ecosystem, and its first nuget PR (#463) came out without one, failing
  # the Conventional Commits check in PR hygiene.
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 10
    groups:
      maven-minor-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "com.networknt:json-schema-validator"
        versions: [">=2.0.0"]
      # artemis-amqp-protocol and proton-j are patched at build time and copied over the same-version
      # jars inside the apache/activemq-artemis sidecar image, so they only move together with that
      # image tag (application.yml): bump them by hand, see ArtemisPatchVersions.
      - dependency-name: "org.apache.activemq:*"
      - dependency-name: "org.apache.qpid:proton-j"
    commit-message:
      prefix: "build"
      include: "scope"
    labels:
      - "dependencies"
      - "java"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    groups:
      actions-minor-patch:
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "build"
      include: "scope"
    labels:
      - "dependencies"
      - "github-actions"

  # The compat suites pin exact SDK versions (requirements.txt, package-lock.json, the csproj) so
  # an upstream release cannot turn unrelated PRs red; upgrades arrive here as their own PRs.
  - package-ecosystem: "pip"
    directory: "/compatibility-tests/sdk-test-python"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    groups:
      compat-python:
        patterns:
          - "*"
    commit-message:
      prefix: "build"
      include: "scope"
    labels:
      - "dependencies"

  - package-ecosystem: "npm"
    directory: "/compatibility-tests/sdk-test-node"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    groups:
      compat-node:
        patterns:
          - "*"
    ignore:
      # ts-jest 29 accepts only typescript <7 as a peer, so a typescript 7 bump fails npm ci and
      # holds back the whole group. Drop this once a ts-jest release accepts typescript 7.
      - dependency-name: "typescript"
        versions: [">=7.0.0"]
    commit-message:
      prefix: "build"
      include: "scope"
    labels:
      - "dependencies"

  - package-ecosystem: "nuget"
    directory: "/compatibility-tests/sdk-test-dotnet"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    groups:
      compat-dotnet:
        patterns:
          - "*"
    commit-message:
      prefix: "build"
      include: "scope"
    labels:
      - "dependencies"
