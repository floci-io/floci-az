name: Release

# Triggered when a version tag (e.g. 1.2.3) is pushed.
# Builds native (amd64 + arm64) Docker images and pushes them to Docker Hub.
#
# Published tags:
#   Native:  floci/floci-az:1.2.3          floci/floci-az:latest
#   Compat:  floci/floci-az:1.2.3-compat   floci/floci-az:latest-compat
#
# Every pushed image carries a provenance attestation (mode=max) and an SBOM, and is signed
# keylessly with cosign by the sign-images job.
#
# Required secrets: DOCKERHUB_USERNAME, DOCKERHUB_TOKEN

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

# Per-tag concurrency. Back-to-back tag pushes (e.g. 1.5.3 and 1.6.0 landing
# minutes apart) resolve to different ${{ github.ref }} values, so they run
# in parallel rather than cancelling each other. Re-runs of the same tag
# supersede in-flight builds of that tag.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Build native artifact: amd64 ────────────────────────────────────────
  build-native-amd64:
    name: Build native artifact (amd64)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: graalvm/setup-graalvm@v1.6.8
        with:
          java-version: '25'
          distribution: 'mandrel'
          cache: maven
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build native executable
        run: ./mvnw clean package -Dnative -DskipTests -B -Dquarkus.native.additional-build-args-append="-march=x86-64-v2"

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: native-amd64
          path: |
            target/*-runner
            target/*.properties
            target/*.so
          if-no-files-found: warn
          retention-days: 1

  # ── Build native artifact: arm64 ────────────────────────────────────────
  build-native-arm64:
    name: Build native artifact (arm64)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: graalvm/setup-graalvm@v1.6.8
        with:
          java-version: '25'
          distribution: 'mandrel'
          cache: maven
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build native executable
        run: ./mvnw clean package -Dnative -DskipTests -B

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: native-arm64
          path: |
            target/*-runner
            target/*.properties
            target/*.so
          if-no-files-found: warn
          retention-days: 1

  # ── Push native + compat Docker images ───────────────────────────────────
  push-native:
    name: Push native and compat Docker images
    needs: [build-native-amd64, build-native-arm64]
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Consumed by sign-images. Each is the digest of the pushed manifest index, which is what
    # cosign signs; the tags are mutable, the digests are not.
    outputs:
      native-digest: ${{ steps.native.outputs.digest }}
      compat-digest: ${{ steps.compat.outputs.digest }}

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Extract version
        id: version
        run: echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Set created timestamp
        id: created
        run: echo "created=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Set SOURCE_DATE_EPOCH
        id: source_date
        run: echo "epoch=$(git log -1 --pretty=%ct)" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v8.0.2
        with:
          name: native-amd64
          path: native/amd64/

      - uses: actions/download-artifact@v8.0.2
        with:
          name: native-arm64
          path: native/arm64/

      - name: Stage binaries under a fixed name
        run: |
          for arch in amd64 arm64; do
            mv native/$arch/*-runner native/$arch/application
          done

      - uses: docker/setup-buildx-action@v4.4.1

      - uses: docker/login-action@v4.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push native multi-arch image
        id: native
        uses: docker/build-push-action@v7.4.0
        env:
          SOURCE_DATE_EPOCH: ${{ steps.source_date.outputs.epoch }}
        with:
          context: .
          file: docker/Dockerfile.native-package
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          tags: |
            floci/floci-az:${{ steps.version.outputs.version }}
            floci/floci-az:latest
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.created.outputs.created }}
            version=${{ steps.version.outputs.version }}
            build-date=${{ steps.created.outputs.created }}
            vcs-ref=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push compat multi-arch image
        id: compat
        uses: docker/build-push-action@v7.4.0
        env:
          SOURCE_DATE_EPOCH: ${{ steps.source_date.outputs.epoch }}
        with:
          context: .
          file: docker/Dockerfile.compat
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          tags: |
            floci/floci-az:${{ steps.version.outputs.version }}-compat
            floci/floci-az:latest-compat
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            BASE_IMAGE=floci/floci-az@${{ steps.native.outputs.digest }}
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.created.outputs.created }}
            version=${{ steps.version.outputs.version }}
            build-date=${{ steps.created.outputs.created }}
            vcs-ref=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Sign the pushed images ──────────────────────────────────────────────
  # Kept out of push-native on purpose: a Fulcio or Rekor outage mid-push would otherwise
  # leave one tag updated and the other unpublished. Signing only reads digests that are
  # already in the registry, so this job can be rerun on its own.
  # Verify a pulled image with:
  #   cosign verify floci/floci-az@<digest> \
  #     --certificate-identity-regexp '^https://github.com/floci-io/floci-az/.github/workflows/release.yml@' \
  #     --certificate-oidc-issuer https://token.actions.githubusercontent.com
  sign-images:
    name: Sign published images
    needs: push-native
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Install Cosign
        # Keyless signing: the job's GitHub Actions OIDC token exchanges for a short-lived
        # Fulcio certificate and the signature is recorded in Rekor's transparency log. No
        # signing key to generate, store, or rotate.
        uses: sigstore/cosign-installer@v4.1.2
        with:
          cosign-release: 'v3.1.3'

      # cosign writes each signature back to the registry beside the image it signs.
      - uses: docker/login-action@v4.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Sign images and their provenance and SBOM attestations
        # --recursive signs the pushed index and every manifest it references, which includes
        # the provenance and SBOM attestation manifests BuildKit attaches.
        env:
          DIGESTS: >-
            ${{ needs.push-native.outputs.native-digest }}
            ${{ needs.push-native.outputs.compat-digest }}
        run: |
          for digest in $DIGESTS; do
            cosign sign --yes --recursive "floci/floci-az@${digest}"
          done
