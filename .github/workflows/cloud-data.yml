name: Cloud Data

# Checks that the vendored cloud catalog (src/main/resources/azure/clouds.json) keeps the shape
# io.floci.az.core.cloud.CloudCatalog loads, and runs the generator's unit tests. CI has no local/
# reference checkouts, so the check here is shape-only; a regeneration against local/azure
# (`make az-data-sync`) is what catches stale values. Python-only, so it is fast and independent
# of the Java build job.

on:
  pull_request:
    paths:
      - 'src/main/resources/azure/**'
      - 'tools/cloud/**'
      - 'Makefile'
      - '.github/workflows/cloud-data.yml'
  push:
    branches:
      - main
    paths:
      - 'src/main/resources/azure/**'
      - 'tools/cloud/**'
      - 'Makefile'
      - '.github/workflows/cloud-data.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cloud-data:
    name: Vendored cloud data well-formed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"

      - name: Install tooling deps
        run: pip install -r tools/cloud/requirements.txt

      - name: Run generator tests
        run: make az-data-test

      - name: Check clouds.json
        run: make az-data-check
