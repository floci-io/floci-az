name: Checkstyle

# Runs tools/checkstyle/checkstyle.xml over src/main/java: no var, no wildcard imports, no inline
# fully qualified names, and the import order AGENTS.md describes.
# Kept out of the Maven build lifecycle so a style slip does not hide a test failure.

on:
  pull_request:
    paths:
      - 'src/main/java/**/*.java'
      - 'tools/checkstyle/**'
      - 'pom.xml'
      - '.github/workflows/checkstyle.yml'
  push:
    branches:
      - main
    paths:
      - 'src/main/java/**/*.java'
      - 'tools/checkstyle/**'
      - 'pom.xml'
      - '.github/workflows/checkstyle.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel a superseded run only on pull requests; a run on main is left to finish (see ci.yml).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checkstyle:
    name: Checkstyle
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '25'
          distribution: 'temurin'

      # Restore only. ci.yml is the repo's single cache writer.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ hashFiles('pom.xml') }}
          restore-keys: |
            maven-${{ runner.os }}-

      - name: Run Checkstyle
        run: ./mvnw -B checkstyle:check

      # A clean run over src/main cannot tell a working rule from one broken so that it matches nothing,
      # so each rule is also run against fixtures it must reject and exemptions it must accept.
      - name: Check the rules against their fixtures
        run: tools/checkstyle/test-rules.sh
