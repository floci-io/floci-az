name: CI

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'pom.xml'
      - '.mvn/**'
      - 'mvnw'
      - 'mvnw.cmd'
      - '.github/workflows/ci.yml'
  pull_request:
    # ready_for_review is not a default type: without it, marking a draft ready
    # would not start the run the draft skipped.
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'src/**'
      - 'pom.xml'
      - '.mvn/**'
      - 'mvnw'
      - 'mvnw.cmd'
      - '.github/workflows/ci.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Drafts skip the suite to spare runners; it runs once the PR is ready for review.
    # Written on the job rather than as a gate job so it costs no runner. Pushes to main
    # always run; `closed` and `edited` are excluded so widening the trigger types cannot
    # let those events through.
    if: >-
      github.event_name != 'pull_request' || (
        github.event.pull_request.draft == false &&
        github.event.pull_request.state != 'closed' &&
        github.event.action != 'edited'
      )
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '25'
          distribution: 'temurin'
          # no `cache: maven` - broken in this action release line: it restores nothing
          # ("maven cache is not found") and then fails to save ("Path Validation Error:
          # Path(s) specified in the action for caching do(es) not exist"), so every run
          # resolved dependencies cold. Explicit cache steps below do the same job.

      # Restore on every run, save from main only. Actions caches are ref-scoped: a
      # pull_request run's write lands in refs/pull/N/merge, which no other PR can read,
      # so a PR save is a private duplicate of what main already publishes under this
      # key. PRs restore main's copy instead. This job is the repo's single cache writer;
      # compatibility.yml and nightly.yml restore the same key read-only.
      #
      # `hashFiles('pom.xml')`, not '**/pom.xml': the glob would also hash
      # compatibility-tests/sdk-test-java/pom.xml, a project this workflow never builds,
      # and an unrelated change there would bust the key.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ hashFiles('pom.xml') }}
          restore-keys: |
            maven-${{ runner.os }}-

      - name: Run tests
        run: ./mvnw test -B

      # `on.push.branches` is [main] only in this workflow, so `push` means main.
      # `always()` so a failed test run still saves the dependencies it resolved.
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: always() && github.event_name == 'push'
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ hashFiles('pom.xml') }}
