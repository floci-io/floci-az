name: Compatibility Tests

on:
  pull_request:
    # ready_for_review is not a default type: without it, marking a draft ready
    # would not start the run the draft skipped.
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'src/**'
      - 'pom.xml'
      - 'Makefile'
      - 'docker/Dockerfile.native-package'
      - 'docker/entrypoint.sh'
      - 'compatibility-tests/**'
      - '.github/ci/**'
      - '.github/workflows/compatibility.yml'
  # The nightly parity legs: every suite against an emulator started at floci-az.parity=azure,
  # on main. Pull requests run the default level only, so a behaviour
  # that is still opt-in cannot fail a PR. GitHub may delay scheduled runs by hours.
  schedule:
    - cron: '30 0 * * *'
      timezone: 'America/Chicago'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The Terraform and OpenTofu suites run the same azurerm configuration and are meant to
  # declare the same resources; a gap must be listed in a .github/ci/compat-iac-allowlist-*.
  iac-drift-check:
    name: compat / terraform and opentofu resource parity
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    # Same draft condition as build-native below.
    if: >-
      github.event_name != 'pull_request' || (
        github.event.pull_request.draft == false &&
        github.event.pull_request.state != 'closed' &&
        github.event.action != 'edited'
      )
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            compatibility-tests
            .github/ci

      - name: Compare compat-terraform and compat-opentofu resources
        run: python3 .github/ci/compat-iac-drift-check.py

  build-native:
    name: Build native floci-az image
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    # Drafts skip the suites to spare runners; they run once the PR is ready for review.
    # Written on the root job rather than as a gate job so it costs no runner, and
    # native-compat-test needs this job, so it skips with it. `closed` and `edited` are
    # excluded so widening the trigger types cannot let those events through.
    if: >-
      github.event_name != 'pull_request' || (
        github.event.pull_request.draft == false &&
        github.event.pull_request.state != 'closed' &&
        github.event.action != 'edited'
      )
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: graalvm/setup-graalvm@f70bc8032f90a104502824a54bcb94b6f01715bc # v1
        with:
          java-version: '25'
          distribution: 'mandrel'
          # no `cache: maven` - it keys on setup-graalvm-Linux-maven-<hash>, a key only
          # this pull_request-only workflow ever writes. Actions caches are ref-scoped, so
          # those writes land in refs/pull/N/merge and no run can read another's: it misses
          # every time while still saving hundreds of MB nothing will read.
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Restore-only, keyed identically to ci.yml so this reads the ~/.m2 that ci.yml saves
      # on push to main. ci.yml stays the single writer; a second writer would race it.
      # Partial-hit caveat: ci.yml runs x64 and this runs arm64, but `runner.os` is Linux
      # for both and Maven artifacts are arch-neutral, so only classifier-based natives
      # re-download. `-Dnative` also pulls native-image plugins `mvn test` never fetches.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ hashFiles('pom.xml') }}
          restore-keys: maven-${{ runner.os }}-

      - name: Build native executable (quick build)
        # maven.test.skip rather than skipTests: skipTests only stops surefire, so the build still
        # compiled all of src/test for a native image that never uses it.
        run: ./mvnw clean package -Dnative -Dmaven.test.skip=true -B -Dquarkus.native.additional-build-args-append="-Ob"

      # Quarkus writes GraalVM's build-output statistics next to the native source jar on every
      # native build; surfacing them gives each PR a size record (image breakdown plus the gzip
      # size of the binary, close to the compressed layer Docker Hub reports). Measurement only.
      - name: Record native build size
        continue-on-error: true
        run: python3 .github/ci/native-size-report.py arm64

      - name: Upload native build stats
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-build-stats-arm64
          path: target/*-native-image-source-jar/*-build-output-stats.json
          retention-days: 30

      - name: Stage native binary for packaging
        run: |
          mkdir -p native/arm64
          cp target/*-runner native/arm64/application
          cp target/*.so native/arm64/ 2>/dev/null || true

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build native Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile.native-package
          tags: floci-az:test-native
          build-args: |
            VERSION=ci-${{ github.sha }}
          outputs: type=docker,dest=/tmp/floci-az-native-image.tar
          # No layer cache here, deliberately. The COPY below brings in a natively
          # compiled binary that changes every commit, and Docker layer reuse is
          # sequential, so nothing after it can ever be reused: the cache was write-only.
          # `mode=max` still stored the whole image, including that volatile
          # multi-hundred-MB binary layer, once per PR ref.

      - name: Compress native image
        run: gzip /tmp/floci-az-native-image.tar

      - name: Upload native floci-az image
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: floci-az-native-image
          path: /tmp/floci-az-native-image.tar.gz
          retention-days: 1

  native-compat-test:
    # The suffix is empty at the default level, so pull request check names do not change.
    name: native / ${{ matrix.test }}${{ matrix.parity && format(' (parity {0})', matrix.parity) || '' }}
    needs: build-native
    runs-on: ubuntu-24.04-arm
    # sdk-test-cpp compiles OpenSSL, libxml2, libcurl and the SDK from source via vcpkg,
    # so it needs more headroom than the suites that install prebuilt packages.
    timeout-minutes: ${{ matrix.timeout_minutes || 20 }}
    strategy:
      fail-fast: false
      matrix:
        test:
          - sdk-test-python
          - sdk-test-java
          - sdk-test-dotnet
          - sdk-test-node
          - sdk-test-cpp
          - compat-terraform
          - compat-opentofu
          - compat-azcli
        # floci-az.parity level the emulator starts at; empty is the default level. Same switch
        # as PARITY in the Makefile (PARITY_EMULATOR_ENV).
        parity: ${{ fromJSON(github.event_name == 'pull_request' && '[""]' || '["azure"]') }}
        # Each entry below extends the legs whose `test` it names. Every `test` here must also be in
        # the list above: an include entry that matches no leg becomes a leg of its own, with no
        # `parity` value, so do not try to drop a suite from the parity run with `exclude`.
        # min_tests: floor on executed test cases, checked after the run. Set loosely, at about
        # a third of the cases each suite declares, so it trips when a suite loses most of its
        # tests rather than on ordinary skips; raise it when a suite grows a lot.
        include:
          - test: sdk-test-python
            min_tests: 50
            emulator_env: >-
              -e FLOCI_AZ_SERVICES_SERVICE_BUS_MOCKED=false
            extra_env: >-
              -e AZURE_POD_IDENTITY_AUTHORITY_HOST=http://floci-az:4577
              -e SERVICEBUS_HOST=floci-az-servicebus-default
              -e SERVICEBUS_AMQP_PORT=5672
              -e SERVICEBUS_NAMESPACE=default
          - test: sdk-test-java
            min_tests: 150
            emulator_env: >-
              -e FLOCI_AZ_SERVICES_SERVICE_BUS_MOCKED=false
              -e FLOCI_AZ_SERVICES_SERVICE_BUS_LOCK_DURATION_SECONDS=5
              -e FLOCI_AZ_SERVICES_AKS_MOCKED=true
            extra_env: >-
              --add-host devstoreaccount1.dfs.core.windows.net:127.0.0.1
              -e FLOCI_AZ_ABFS_LOOPBACK=true
              -e SERVICEBUS_HOST=floci-az-servicebus-default
              -e SERVICEBUS_AMQPS_PORT=5671
              -e SERVICEBUS_NAMESPACE=default
              -e AZURE_POD_IDENTITY_AUTHORITY_HOST=http://floci-az:4577
          - test: sdk-test-dotnet
            min_tests: 20
            emulator_env: >-
              -e FLOCI_AZ_SERVICES_SERVICE_BUS_MOCKED=false
            extra_env: >-
              -e SERVICEBUS_HOST=floci-az-servicebus-default
              -e SERVICEBUS_AMQP_PORT=5672
          - test: sdk-test-node
            min_tests: 30
            emulator_env: >-
              -e FLOCI_AZ_SERVICES_SERVICE_BUS_MOCKED=false
            extra_env: >-
              -e SERVICEBUS_HOST=floci-az-servicebus-default
              -e SERVICEBUS_AMQP_PORT=5672
              -e SERVICEBUS_NAMESPACE=default
              -e AZURE_POD_IDENTITY_AUTHORITY_HOST=http://floci-az:4577
          - test: sdk-test-cpp
            min_tests: 5
            timeout_minutes: 45
          - test: compat-terraform
            min_tests: 7
          - test: compat-opentofu
            min_tests: 7
          - test: compat-azcli
            min_tests: 10

    steps:
      - name: Download native floci-az image
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: floci-az-native-image
          path: /tmp

      - name: Load native floci-az image
        run: gunzip -c /tmp/floci-az-native-image.tar.gz | docker load

      - name: Create Docker network
        run: docker network create compat-net

      - name: Start floci-az
        run: |
          docker run -d --name floci-az --network compat-net \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -p 4577:4577 \
            -e FLOCI_AZ_SERVICES_DOCKER_NETWORK=compat-net \
            -e FLOCI_AZ_TLS_ENABLED=true \
            -e FLOCI_AZ_HOSTNAME=floci-az \
            ${{ matrix.emulator_env }} \
            ${{ matrix.parity && format('-e FLOCI_AZ_PARITY={0}', matrix.parity) || '' }} \
            floci-az:test-native

      # Waits on Docker's health status rather than curling the port so the image's
      # HEALTHCHECK runs under CI: the native image has no curl and probes over bash's
      # /dev/tcp, and a malformed probe would otherwise leave the container "unhealthy"
      # while the suites pass against the open port. Healthy takes one interval (5 s);
      # unhealthy takes retries x interval (50 s) and fails fast here.
      - name: Wait for floci-az to be healthy
        run: |
          health=starting
          for _ in $(seq 1 90); do
            health=$(docker inspect -f '{{.State.Health.Status}}' floci-az)
            if [ "$health" = healthy ]; then
              exit 0
            fi
            if [ "$health" = unhealthy ]; then
              break
            fi
            sleep 1
          done
          echo "::error::floci-az did not report healthy (last status: $health)"
          docker inspect -f '{{json .State.Health}}' floci-az
          docker logs --tail 50 floci-az
          exit 1

      # A static initializer runs at native build time, where FLOCI_AZ_VERSION is unset, so a
      # regression there reports "dev" from every release binary; JVM-mode tests cannot see it.
      - name: Check floci-az reports its build version
        run: curl -sf http://localhost:4577/_floci/health | jq -e --arg v "ci-${{ github.sha }}" '.version == $v'

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            compatibility-tests
            .github/ci

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build test image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: compatibility-tests/${{ matrix.test }}
          load: true
          # Same repo-prefixed tag as the Makefile's suite images.
          tags: floci-az-${{ matrix.test }}
          # Read-only on purpose. Actions caches are ref-scoped, so a pull_request run's
          # writes land in refs/pull/N/merge, private to that PR: eight images per open PR
          # overran the repo's cache budget and evicted entries between a PR's own runs.
          # warm-compat-caches.yml populates these scopes on main; PRs read that one copy.
          cache-from: type=gha,scope=${{ runner.os }}-${{ runner.arch }}-${{ matrix.test }}

      - name: Run tests
        id: tests
        run: |
          mkdir -p test-results
          docker run --rm --network compat-net \
            -e FLOCI_AZ_ENDPOINT=http://floci-az:4577 \
            ${{ matrix.extra_env }} \
            -v "$(pwd)/test-results:/results" \
            floci-az-${{ matrix.test }}

      # The container's exit code alone passes a suite whose setup aborted or whose tests all
      # skipped themselves. Counts executed test cases across the suite's JUnit reports and fails
      # below the leg's min_tests, so a suite that silently loses most of its tests fails too.
      - name: Fail a suite that ran no tests
        run: python3 .github/ci/compat-test-count-check.py --min "${{ matrix.min_tests }}" test-results

      - name: Generate test summary
        if: always() && steps.tests.outcome != 'skipped'
        uses: test-summary/action@37b508cfee6d4d080eedd00b5bb240a6a784a6a5 # v2.6
        with:
          paths: test-results/*.xml

      # The suites run their build tools quietly in the container, so the job log has no
      # per-class timings. Measurement only: a reporting bug must never fail a green leg.
      - name: Report slowest test classes
        if: always() && steps.tests.outcome != 'skipped'
        continue-on-error: true
        run: python3 .github/ci/compat-timing-report.py test-results

      - name: Upload test results
        if: always() && steps.tests.outcome != 'skipped'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: compat-results-${{ matrix.test }}${{ matrix.parity && format('-parity-{0}', matrix.parity) || '' }}
          path: test-results/
          if-no-files-found: warn
          retention-days: 14

      - name: Dump floci-az logs
        # A job cancelled at timeout-minutes is not a failure, but a hung suite is the case
        # where the server log matters most.
        if: failure() || cancelled()
        run: docker logs floci-az
