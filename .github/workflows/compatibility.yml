name: Compatibility Tests

on:
  pull_request:
    paths:
      - 'src/**'
      - 'pom.xml'
      - 'Makefile'
      - 'docker/Dockerfile.native-package'
      - 'docker/entrypoint.sh'
      - 'compatibility-tests/**'
      - '.github/workflows/compatibility.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-native:
    name: Build native floci-az image
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: graalvm/setup-graalvm@5298d94fb55a4f185c602eeac5de1b553882abe2 # v1
        with:
          java-version: '25'
          distribution: 'mandrel'
          # no `cache: maven` - it keys on setup-graalvm-Linux-maven-<hash>, a key only
          # this pull_request-only workflow ever writes. Actions caches are ref-scoped, so
          # those writes land in refs/pull/N/merge and no run can read another's: it misses
          # every time while still saving hundreds of MB nothing will read.
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Restore-only, keyed identically to ci.yml so this reads the ~/.m2 that ci.yml saves
      # on push to main. ci.yml stays the single writer; a second writer would race it.
      # Partial-hit caveat: ci.yml runs x64 and this runs arm64, but `runner.os` is Linux
      # for both and Maven artifacts are arch-neutral, so only classifier-based natives
      # re-download. `-Dnative` also pulls native-image plugins `mvn test` never fetches.
      - uses: actions/cache/restore@v6.1.0
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ hashFiles('pom.xml') }}
          restore-keys: maven-${{ runner.os }}-

      - name: Build native executable (quick build)
        run: ./mvnw clean package -Dnative -DskipTests -B -Dquarkus.native.additional-build-args-append="-Ob"

      - name: Stage native binary for packaging
        run: |
          mkdir -p native/arm64
          cp target/*-runner native/arm64/application
          cp target/*.so native/arm64/ 2>/dev/null || true

      - uses: docker/setup-buildx-action@v4.3.0

      - name: Build native Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.native-package
          tags: floci-az:test-native
          outputs: type=docker,dest=/tmp/floci-az-native-image.tar
          # No layer cache here, deliberately. The COPY below brings in a natively
          # compiled binary that changes every commit, and Docker layer reuse is
          # sequential, so nothing after it can ever be reused: the cache was write-only.
          # `mode=max` still stored the whole image, including that volatile
          # multi-hundred-MB binary layer, once per PR ref.

      - name: Compress native image
        run: gzip /tmp/floci-az-native-image.tar

      - name: Upload native floci-az image
        uses: actions/upload-artifact@v7
        with:
          name: floci-az-native-image
          path: /tmp/floci-az-native-image.tar.gz
          retention-days: 1

  native-compat-test:
    name: native / ${{ matrix.test }}
    needs: build-native
    runs-on: ubuntu-24.04-arm
    # sdk-test-cpp compiles OpenSSL, libxml2, libcurl and the SDK from source via vcpkg,
    # so it needs more headroom than the suites that install prebuilt packages.
    timeout-minutes: ${{ matrix.timeout_minutes || 20 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - test: sdk-test-python
            extra_env: >-
              -e AZURE_POD_IDENTITY_AUTHORITY_HOST=http://floci-az:4577
          - test: sdk-test-java
            emulator_env: >-
              -e FLOCI_AZ_SERVICES_SERVICE_BUS_MOCKED=false
              -e FLOCI_AZ_SERVICES_SERVICE_BUS_LOCK_DURATION_SECONDS=5
            extra_env: >-
              --add-host devstoreaccount1.dfs.core.windows.net:127.0.0.1
              -e FLOCI_AZ_ABFS_LOOPBACK=true
              -e SERVICEBUS_HOST=floci-az-servicebus-default
              -e SERVICEBUS_AMQPS_PORT=5671
              -e SERVICEBUS_NAMESPACE=default
              -e AZURE_POD_IDENTITY_AUTHORITY_HOST=http://floci-az:4577
          - test: sdk-test-dotnet
            emulator_env: >-
              -e FLOCI_AZ_SERVICES_SERVICE_BUS_MOCKED=false
            extra_env: >-
              -e SERVICEBUS_HOST=floci-az-servicebus-default
              -e SERVICEBUS_AMQP_PORT=5672
          - test: sdk-test-node
            emulator_env: >-
              -e FLOCI_AZ_SERVICES_SERVICE_BUS_MOCKED=false
            extra_env: >-
              -e SERVICEBUS_HOST=floci-az-servicebus-default
              -e SERVICEBUS_AMQP_PORT=5672
              -e SERVICEBUS_NAMESPACE=default
              -e AZURE_POD_IDENTITY_AUTHORITY_HOST=http://floci-az:4577
          - test: sdk-test-cpp
            timeout_minutes: 45
          - test: compat-terraform
          - test: compat-opentofu
          - test: compat-azcli

    steps:
      - name: Download native floci-az image
        uses: actions/download-artifact@v8
        with:
          name: floci-az-native-image
          path: /tmp

      - name: Load native floci-az image
        run: gunzip -c /tmp/floci-az-native-image.tar.gz | docker load

      - name: Create Docker network
        run: docker network create compat-net

      - name: Start floci-az
        run: |
          docker run -d --name floci-az --network compat-net \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -p 4577:4577 \
            -e FLOCI_AZ_SERVICES_DOCKER_NETWORK=compat-net \
            -e FLOCI_AZ_TLS_ENABLED=true \
            -e FLOCI_AZ_HOSTNAME=floci-az \
            ${{ matrix.emulator_env }} \
            floci-az:test-native

      - name: Wait for floci-az to be ready
        run: timeout 60 bash -c 'until curl -sf http://localhost:4577/health >/dev/null 2>&1; do sleep 1; done'

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          sparse-checkout: compatibility-tests

      - uses: docker/setup-buildx-action@v4.3.0

      - name: Build test image
        uses: docker/build-push-action@v7
        with:
          context: compatibility-tests/${{ matrix.test }}
          load: true
          tags: compat-${{ matrix.test }}
          # Read-only on purpose. Actions caches are ref-scoped, so a pull_request run's
          # writes land in refs/pull/N/merge, private to that PR: eight images per open PR
          # overran the repo's cache budget and evicted entries between a PR's own runs.
          # warm-compat-caches.yml populates these scopes on main; PRs read that one copy.
          cache-from: type=gha,scope=${{ runner.os }}-${{ runner.arch }}-${{ matrix.test }}

      - name: Run tests
        id: tests
        run: |
          mkdir -p test-results
          docker run --rm --network compat-net \
            -e FLOCI_AZ_ENDPOINT=http://floci-az:4577 \
            ${{ matrix.extra_env }} \
            -v "$(pwd)/test-results:/results" \
            compat-${{ matrix.test }}

      - name: Generate test summary
        if: always() && steps.tests.outcome != 'skipped'
        uses: test-summary/action@v2
        with:
          paths: test-results/*.xml

      - name: Dump floci-az logs
        if: failure()
        run: docker logs floci-az
