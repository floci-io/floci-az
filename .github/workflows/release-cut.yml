name: Release Cut

# One-button release: dispatched manually from main, runs semantic-release,
# which analyzes the Conventional Commits since the last tag, bumps pom.xml,
# rewrites CHANGELOG.md, commits, tags, and publishes the GitHub Release.
# The tag push then triggers release.yml, which builds and publishes the
# Docker images.
#
# GH_TOKEN must be a PAT (fine-grained, contents: write) — NOT the default
# GITHUB_TOKEN. Tags pushed with the default GITHUB_TOKEN do not trigger
# other workflows (GitHub's recursion guard), so release.yml would silently
# never run.
#
# Use the dry-run input to preview the computed next version and release
# notes without tagging or publishing anything.

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Compute the next version and notes without releasing'
        type: boolean
        default: false

permissions:
  contents: write

# Serialize release cuts: a second dispatch queues behind the first instead of
# racing it to the same version/tag. No cancel-in-progress — never kill a
# mid-flight release. GitHub keeps at most ONE pending run per group, so if
# several dispatches pile up, only the latest pending one runs — intentional:
# duplicate queued release cuts are redundant by definition (the surviving run
# re-analyzes main and releases whatever is unreleased).
concurrency:
  group: release-cut

jobs:
  release:
    name: Run semantic-release
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          token: ${{ secrets.GH_TOKEN }}
          fetch-depth: 0

      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Install the pinned release toolchain
        run: npm ci --prefix .github/release-tooling --ignore-scripts

      - name: Run semantic-release
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: ./.github/release-tooling/node_modules/.bin/semantic-release ${{ inputs.dry-run && '--dry-run' || '' }}
